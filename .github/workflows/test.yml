name: test

on:
  # main seulement : un push de tag ou de branche relançait la CI sur un commit
  # déjà testé ; les autres branches passent par leur pull request
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un nouveau push sur une PR annule le run précédent, devenu obsolète ; sur main,
# chaque commit garde son run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-24.04
    # Le défaut de GitHub est 360 min ; ce job dure ~10 s
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Aucun job ne pousse : le jeton n'a pas à rester dans .git/config
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    # ~30 s d'habitude : au-delà de 10 min, Chrome ou le conteneur est bloqué
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Aucun job ne pousse : le jeton n'a pas à rester dans .git/config
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Google Chrome et podman sont préinstallés sur les runners Ubuntu :
      # pas de navigateur Playwright à télécharger
      # Version épinglée : une nouvelle version de Playwright ne doit pas casser la CI à elle seule
      - run: pip install playwright==1.63.0
      - run: podman pull docker.io/nginxinc/nginx-unprivileged:1.30-alpine
      - run: python3 tests/e2e.py web
