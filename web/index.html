<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zalgo</title>
<meta name="description" content="Corrupt your text with zalgo combining marks and copy it in one click.">
<meta name="theme-color" content="#050406">
<meta property="og:title" content="zalgo">
<meta property="og:description" content="Corrupt your text. Copy it. He comes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050406'/%3E%3Cpath d='M6 32q26-24 52 0q-26 24-52 0z' fill='none' stroke='%23d9d2c7' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23e01b2f'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23050406'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/cormorant-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/noto-serif-zalgo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="zalgo.js">
<link rel="modulepreload" href="i18n.js">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="glow" id="glow" aria-hidden="true"></div>
<div class="echo" id="echo" aria-hidden="true"></div>
<div class="fx" id="fx" aria-hidden="true"></div>

<main class="wrap">
  <header class="head">
    <h1 class="title" aria-label="zalgo"><span id="title" aria-hidden="true">zalgo</span></h1>
    <p class="sub" id="sub">he comes</p>
  </header>

  <section class="altar">
    <div class="lbl">
      <label for="src" data-i18n="textLabel">your text</label>
      <button type="button" id="purify" class="ghost" data-i18n="purify" data-i18n-title="purifyTitle" title="Strip every zalgo mark from the text">purify</button>
    </div>
    <textarea id="src" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="write what must be corrupted…"></textarea>

    <div class="controls">
      <div class="level">
        <label for="level" data-i18n="level">corruption</label>
        <input type="range" id="level" min="0" max="100" value="35">
        <output id="level-val" for="level">unrest</output>
      </div>
      <div class="chips" role="group" data-i18n-aria="zones" aria-label="Corrupted zones">
        <button type="button" class="chip" data-part="above" aria-pressed="true" data-i18n="above">above</button>
        <button type="button" class="chip" data-part="through" aria-pressed="true" data-i18n="through">through</button>
        <button type="button" class="chip" data-part="below" aria-pressed="true" data-i18n="below">below</button>
        <button type="button" class="chip reroll" id="reroll" data-i18n-title="rerollTitle" title="New roll (Alt+R)"><span aria-hidden="true">⟳</span> <span data-i18n="reroll">reroll</span></button>
      </div>
    </div>

    <div class="out-wrap">
      <span class="hint" aria-hidden="true" data-i18n="hint">click to copy</span>
      <div class="out" id="out" role="button" tabindex="0" data-i18n-aria="outLabel" aria-label="Result: click to copy" data-i18n-placeholder="outPlaceholder" data-placeholder="…the result will appear here"></div>
    </div>

    <div class="bar">
      <span class="count" id="count"></span>
      <button type="button" id="copy" class="copy"><span id="copy-label">copy</span><kbd id="kbd">ctrl ↵</kbd></button>
    </div>
  </section>

  <footer class="foot">
    <span data-i18n="footer">everything happens in your browser · nothing is sent</span>
    <select id="lang" class="lang" data-i18n-aria="language" aria-label="Language"></select>
  </footer>
</main>

<div class="toast" id="toast" aria-hidden="true"></div>
<div class="sr" id="live" aria-live="polite"></div>
</body>
</html>
