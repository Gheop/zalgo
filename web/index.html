<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zalgo</title>
<meta name="description" content="Corromps ton texte avec des diacritiques zalgo et copie-le d'un geste.">
<meta name="theme-color" content="#050406">
<meta property="og:title" content="zalgo">
<meta property="og:description" content="Corromps ton texte. Copie-le. Il vient.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050406'/%3E%3Cpath d='M6 32q26-24 52 0q-26 24-52 0z' fill='none' stroke='%23d9d2c7' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23e01b2f'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23050406'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/cormorant-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/noto-serif-zalgo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="zalgo.js">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="glow" id="glow" aria-hidden="true"></div>
<div class="echo" id="echo" aria-hidden="true"></div>
<div class="fx" id="fx" aria-hidden="true"></div>

<main class="wrap">
  <header class="head">
    <h1 class="title" aria-label="zalgo"><span id="title" aria-hidden="true">zalgo</span></h1>
    <p class="sub" id="sub">il vient</p>
  </header>

  <section class="altar">
    <div class="lbl">
      <label for="src">ton texte</label>
      <button type="button" id="purify" class="ghost" title="Retirer toutes les marques zalgo du texte">purifier</button>
    </div>
    <textarea id="src" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="écris ce qui doit être corrompu…"></textarea>

    <div class="controls">
      <div class="level">
        <label for="level">corruption</label>
        <input type="range" id="level" min="0" max="100" value="35">
        <output id="level-val" for="level">trouble</output>
      </div>
      <div class="chips" role="group" aria-label="Zones corrompues">
        <button type="button" class="chip" data-part="above" aria-pressed="true">dessus</button>
        <button type="button" class="chip" data-part="through" aria-pressed="true">travers</button>
        <button type="button" class="chip" data-part="below" aria-pressed="true">dessous</button>
        <button type="button" class="chip reroll" id="reroll" title="Nouveau tirage (Alt+R)"><span aria-hidden="true">⟳</span> relancer</button>
      </div>
    </div>

    <div class="out-wrap">
      <span class="hint" aria-hidden="true">toucher pour copier</span>
      <div class="out" id="out" role="button" tabindex="0" aria-label="Résultat : cliquer pour copier" data-placeholder="…le résultat apparaîtra ici"></div>
    </div>

    <div class="bar">
      <span class="count" id="count"></span>
      <button type="button" id="copy" class="copy"><span id="copy-label">copier</span><kbd id="kbd">ctrl ↵</kbd></button>
    </div>
  </section>

  <footer class="foot">tout se passe dans ton navigateur · rien n'est envoyé</footer>
</main>

<div class="toast" id="toast" aria-hidden="true"></div>
<div class="sr" id="live" aria-live="polite"></div>
</body>
</html>
