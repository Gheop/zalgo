server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  # Niveau 6 au lieu de 1 : ~1,5 Ko de moins par première visite, ~50 µs de CPU en plus par réponse
  gzip_comp_level 6;
  gzip_types text/css application/javascript image/svg+xml;

  # HSTS relève du proxy qui termine le TLS
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control "no-cache" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Un add_header dans un location remplace tous ceux du bloc server : les
  # en-têtes de sécurité sont donc répétés ici
  location /fonts/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
